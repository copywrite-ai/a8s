- name: "{{ lookup('pipe', 'date +%H:%M:%S') }} | {{ target_ip }} | {{ app_name }} | Load config"
  set_fact:
    current_app: "{{ app_definitions[app_name] }}"
    healthcheck_config: "{{ current_app.healthcheck | default({}) }}"

# 8. 使用模块化健康检查
- name: "{{ lookup('pipe', 'date +%H:%M:%S') }} | {{ target_ip }} | {{ app_name }} | HealthCheck | Wait for app to be ready"
  include_tasks: healthcheck_v2.yml
  vars:
    # app_name 已经在作用域中，无需重复定义导致递归
    app_type: "{{ current_app.app_type | default('docker') }}"
    delegate_host: "{{ target_ip }}"
    retries: "{{ healthcheck_config.retries | default(30) }}"
    interval: "{{ healthcheck_config.interval | default(5) }}"
    debug_mode: true